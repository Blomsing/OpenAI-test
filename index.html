<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Living City Ruler-RPG (Prototype)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:#0b1020; color:#e5e7eb; }
    .wrap { display:grid; grid-template-columns: 340px 1fr; min-height:100vh; }
    .panel { padding:16px; border-right:1px solid #1f2937; background:#0f172a; overflow:auto; }
    h1 { font-size:1.1rem; margin:0 0 10px; color:#7dd3fc; }
    h2 { font-size:0.9rem; margin:14px 0 6px; color:#93c5fd; }
    .row { display:flex; justify-content:space-between; margin:4px 0; font-size:0.86rem; }
    .slider { height:8px; background:#1f2937; border-radius:999px; overflow:hidden; }
    .slider > div { height:100%; }
    .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    button { background:#1d4ed8; color:white; border:none; border-radius:8px; padding:8px; cursor:pointer; font-size:0.8rem; }
    button:hover { background:#2563eb; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .log { margin-top:8px; font-size:.78rem; background:#020617; border:1px solid #1f2937; border-radius:8px; padding:8px; height:180px; overflow:auto; }
    canvas { width:100%; height:100vh; display:block; background:#111827; }
    .hint { font-size:0.75rem; color:#9ca3af; margin-top:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <aside class="panel">
    <h1>Living City Ruler-RPG</h1>
    <div class="row"><span>Month / Week</span><strong id="time"></strong></div>
    <div class="row"><span>Treasury</span><strong id="treasury"></strong></div>
    <div class="row"><span>Influence</span><strong id="influence"></strong></div>
    <div class="row"><span>Personal Wealth</span><strong id="wealth"></strong></div>

    <h2>Identity Sliders</h2>
    <div class="row"><span>Morality</span><span id="moralityLabel"></span></div>
    <div class="slider"><div id="moralityBar"></div></div>
    <div class="row"><span>Civic Culture</span><span id="cultureLabel"></span></div>
    <div class="slider"><div id="cultureBar"></div></div>
    <div class="row"><span>Faith</span><span id="faithLabel"></span></div>
    <div class="slider"><div id="faithBar"></div></div>

    <h2>Conditions</h2>
    <div id="conditions"></div>

    <h2>Weekly Actions</h2>
    <div class="btns">
      <button data-action="market">Market Project</button>
      <button data-action="guard">Guard Expansion</button>
      <button data-action="arcane">Arcane Lab</button>
      <button data-action="relief">Public Relief</button>
      <button data-action="purge">Political Purge</button>
      <button data-action="patronage">Private Patronage</button>
      <button data-action="faithOrder">Back Order Faith</button>
      <button data-action="faithVeil">Back Veiled Faith</button>
    </div>
    <button id="endWeek" style="margin-top:10px;width:100%;background:#047857">End Week</button>
    <div class="hint">Goal: keep districts stable while shaping identity. Survive 12 months for MVP victory.</div>

    <h2>Event Log</h2>
    <div id="log" class="log"></div>
  </aside>
  <main><canvas id="map" width="1200" height="900"></canvas></main>
</div>

<script>
const state = {
  month:1, week:1,
  treasury:140, influence:60, wealth:90,
  morality:50,
  culture:50, // 0 mercantile, 50 martial, 100 arcane
  faith:50,   // 0 order, 50 old ways, 100 veiled
  actionsTaken:0,
  maxActions:3,
  gameOver:false,
  districts:[
    {name:'Market Ward', x:180,y:170, mood:70, condition:{crime:40,hunger:20,unrest:25,corruption:45,magic:10}, leader:'Guildmaster Varo'},
    {name:'Citadel Ring', x:530,y:170, mood:75, condition:{crime:20,hunger:15,unrest:20,corruption:15,magic:20}, leader:'Watch Captain Elra'},
    {name:'Temple Hill', x:880,y:170, mood:65, condition:{crime:18,hunger:25,unrest:30,corruption:10,magic:35}, leader:'Temple Keeper Neris'},
    {name:'Dockside', x:180,y:500, mood:55, condition:{crime:55,hunger:35,unrest:45,corruption:50,magic:15}, leader:'Noble Steward Corin'},
    {name:'Scholars Quarter', x:530,y:500, mood:62, condition:{crime:25,hunger:20,unrest:35,corruption:20,magic:60}, leader:'Magister Ysil'},
    {name:'Old Gardens', x:880,y:500, mood:68, condition:{crime:15,hunger:28,unrest:22,corruption:12,magic:28}, leader:'Community Elder Mair'},
  ],
  log:[]
};

const $ = id => document.getElementById(id);
const canvas = $('map');
const ctx = canvas.getContext('2d');

document.querySelectorAll('[data-action]').forEach(btn => btn.onclick = () => performAction(btn.dataset.action));
$('endWeek').onclick = endWeek;

function addLog(msg){ state.log.unshift(`M${state.month}W${state.week}: ${msg}`); state.log = state.log.slice(0,20); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function roll(n){ return Math.floor(Math.random()*n); }

function performAction(action){
  if (state.gameOver || state.actionsTaken>=state.maxActions) return;
  switch(action){
    case 'market':
      if(state.treasury<18) return addLog('Not enough Treasury for market project.');
      state.treasury-=18; state.culture=clamp(state.culture-8,0,100);
      state.districts.forEach(d=>{ d.condition.hunger=clamp(d.condition.hunger-6,0,100); d.condition.corruption=clamp(d.condition.corruption+4,0,100);} );
      addLog('Market project funded: hunger falls, corruption risk rises.'); break;
    case 'guard':
      if(state.treasury<16) return addLog('Not enough Treasury for guard expansion.');
      state.treasury-=16; state.culture=clamp(state.culture+6,0,100); state.morality=clamp(state.morality-4,0,100);
      state.districts.forEach(d=>{ d.condition.crime=clamp(d.condition.crime-9,0,100); d.condition.unrest=clamp(d.condition.unrest+2,0,100);} );
      addLog('Guard expansion enacted: crime reduced through strict order.'); break;
    case 'arcane':
      if(state.treasury<20) return addLog('Not enough Treasury for arcane lab.');
      state.treasury-=20; state.culture=clamp(state.culture+10,0,100); state.faith=clamp(state.faith+8,0,100);
      state.districts.forEach(d=>{ d.condition.magic=clamp(d.condition.magic+8,0,100); d.condition.hunger=clamp(d.condition.hunger-4,0,100);} );
      addLog('Arcane lab sponsored: innovation rises with instability.'); break;
    case 'relief':
      if(state.treasury<14) return addLog('Not enough Treasury for relief.');
      state.treasury-=14; state.morality=clamp(state.morality+8,0,100);
      state.districts.forEach(d=>{ d.condition.hunger=clamp(d.condition.hunger-10,0,100); d.condition.unrest=clamp(d.condition.unrest-5,0,100); d.mood=clamp(d.mood+4,0,100);} );
      addLog('Humane relief distributed city-wide.'); break;
    case 'purge':
      if(state.influence<14) return addLog('Not enough Influence for purge.');
      state.influence-=14; state.morality=clamp(state.morality-10,0,100); state.faith=clamp(state.faith+5,0,100);
      state.districts.forEach(d=>{ d.condition.corruption=clamp(d.condition.corruption-10,0,100); d.condition.unrest=clamp(d.condition.unrest+10,0,100);} );
      addLog('Political purge executed: corruption down, fear and unrest up.'); break;
    case 'patronage':
      if(state.wealth<16) return addLog('Not enough Personal Wealth for patronage.');
      state.wealth-=16; state.influence+=10; state.morality=clamp(state.morality+2,0,100);
      addLog('Private patronage buys loyalty and standing.'); break;
    case 'faithOrder':
      if(state.influence<10) return addLog('Not enough Influence to back Order Faith.');
      state.influence-=10; state.faith=clamp(state.faith-10,0,100); state.culture=clamp(state.culture+3,0,100);
      state.districts.forEach(d=>d.condition.unrest=clamp(d.condition.unrest-5,0,100));
      addLog('Order Faith elevated: stability improves.'); break;
    case 'faithVeil':
      if(state.wealth<10) return addLog('Not enough Personal Wealth to back Veiled Faith.');
      state.wealth-=10; state.faith=clamp(state.faith+12,0,100); state.morality=clamp(state.morality-4,0,100);
      state.districts.forEach(d=>{ d.condition.magic=clamp(d.condition.magic+7,0,100); d.condition.unrest=clamp(d.condition.unrest+2,0,100); });
      addLog('Veiled circles protected: occult influence grows.'); break;
  }
  state.actionsTaken++; render();
}

function endWeek(){
  if (state.gameOver) return;
  state.districts.forEach(d=>{
    d.condition.crime = clamp(d.condition.crime + roll(5)-1,0,100);
    d.condition.hunger = clamp(d.condition.hunger + roll(6)-2,0,100);
    d.condition.unrest = clamp(d.condition.unrest + Math.floor((d.condition.crime + d.condition.hunger)/80) + roll(4)-1,0,100);
    d.condition.corruption = clamp(d.condition.corruption + roll(4)-1,0,100);
    d.condition.magic = clamp(d.condition.magic + (state.culture>65?2:0) + roll(3)-1,0,100);
    const pressure=(d.condition.crime+d.condition.hunger+d.condition.unrest+d.condition.corruption+d.condition.magic)/5;
    d.mood=clamp(Math.round(100-pressure),0,100);
    if(d.mood<30){ addLog(`${d.name} enters flashpoint (${d.leader} demands action).`); state.influence=clamp(state.influence-3,0,999); }
  });

  state.week++; state.actionsTaken=0;
  if(state.week>4){
    state.week=1; state.month++;
    const avgMood=state.districts.reduce((a,d)=>a+d.mood,0)/state.districts.length;
    state.treasury += Math.round(18 + avgMood/7 - state.districts.reduce((a,d)=>a+d.condition.corruption,0)/35);
    state.influence += Math.round((avgMood-50)/8);
    state.wealth += Math.round(8 + (50-Math.abs(state.culture-25))/10);
    addLog('New month income applied from city performance.');
  }

  if(state.month>12){ state.gameOver=true; addLog('Campaign victory: your rule endures 12 months.'); }
  if(state.districts.filter(d=>d.mood<20).length>=3){ state.gameOver=true; addLog('Collapse: multiple districts rebel.'); }
  render();
}

function getAvgConditions(){
  const sum={crime:0,hunger:0,unrest:0,corruption:0,magic:0};
  state.districts.forEach(d=>Object.keys(sum).forEach(k=>sum[k]+=d.condition[k]));
  Object.keys(sum).forEach(k=>sum[k]=Math.round(sum[k]/state.districts.length));
  return sum;
}

function renderUI(){
  $('time').textContent=`${state.month} / ${state.week}`;
  $('treasury').textContent=state.treasury;
  $('influence').textContent=state.influence;
  $('wealth').textContent=state.wealth;
  $('moralityLabel').textContent=state.morality>55?'Good':state.morality<45?'Evil':'Balanced';
  $('cultureLabel').textContent=state.culture<34?'Mercantile':state.culture<67?'Martial':'Arcane';
  $('faithLabel').textContent=state.faith<34?'Order':state.faith<67?'Old Ways':'Veiled';
  $('moralityBar').style.width = `${state.morality}%`; $('moralityBar').style.background = state.morality>50?'#34d399':'#f87171';
  $('cultureBar').style.width = `${state.culture}%`; $('cultureBar').style.background = '#60a5fa';
  $('faithBar').style.width = `${state.faith}%`; $('faithBar').style.background = '#a78bfa';

  const avg=getAvgConditions();
  $('conditions').innerHTML = Object.entries(avg).map(([k,v])=>`<div class='row'><span>${k}</span><strong>${v}</strong></div>`).join('');
  $('log').innerHTML = state.log.map(x=>`<div>${x}</div>`).join('');

  document.querySelectorAll('[data-action]').forEach(b=>b.disabled = state.actionsTaken>=state.maxActions || state.gameOver);
  $('endWeek').disabled = state.gameOver;
}

function drawMap(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const bg = ctx.createLinearGradient(0,0,0,canvas.height); bg.addColorStop(0,'#0b1225'); bg.addColorStop(1,'#1e293b');
  ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);

  state.districts.forEach(d=>{
    const hue = Math.round((d.mood/100)*120);
    ctx.fillStyle=`hsl(${hue},70%,35%)`;
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(d.x,d.y,250,220,18); ctx.fill(); ctx.stroke();
    ctx.fillStyle='white'; ctx.font='22px Inter'; ctx.fillText(d.name,d.x+14,d.y+34);
    ctx.font='16px Inter'; ctx.fillText(`Leader: ${d.leader}`,d.x+14,d.y+58);
    ctx.fillText(`Mood: ${d.mood}`,d.x+14,d.y+82);
    ctx.font='14px Inter';
    ctx.fillText(`Crime ${d.condition.crime}  Hunger ${d.condition.hunger}`,d.x+14,d.y+112);
    ctx.fillText(`Unrest ${d.condition.unrest}  Corruption ${d.condition.corruption}`,d.x+14,d.y+132);
    ctx.fillText(`Magic ${d.condition.magic}`,d.x+14,d.y+152);
  });

  if(state.gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#f8fafc'; ctx.font='bold 64px Inter'; ctx.fillText('Campaign Ended',360,420);
  }
}

function render(){ renderUI(); drawMap(); }
addLog('Rule begins. Define what this city will become.');
render();
</script>
</body>
</html>
